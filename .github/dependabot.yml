version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - 'rudderlabs/*'
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - '@rudderlabs/*'
        - '@rudderstack/*'
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Major updates match no group, so each one gets its own PR.
      npm-production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        applies-to: version-updates
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - '**/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      # Node security releases must not wait: the node base gets no cooldown.
      # The docker ecosystem gets no security updates, so this is the only path.
      exclude:
        - 'node'
    ignore:
      # A Node major is a planned upgrade, not a weekly bump.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      docker-base:
        patterns:
          - '*'
