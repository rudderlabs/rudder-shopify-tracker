name: Tests with lint check and code coverage
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

  pull_request:
    types: ['opened', 'reopened', 'synchronize']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Tests with lint check and code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # .nvmrc is the one Node version source. This fails when the Dockerfile
      # or engines.node drifts from it.
      - name: Check Node version pins
        run: npm run check:node-version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & lint check
        run: |
          npm run test
          npm run check:lint

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./reports/coverage

      - name: Update sonar-project.properties
        run: |
          # Retrieve the version from package.json
          version=$(node -e "console.log(require('./package.json').version)")
          # Update the sonar-project.properties file with the version
          sed -i "s/sonar.projectVersion=.*$/sonar.projectVersion=$version/" sonar-project.properties

      - name: Fix filesystem paths in generated reports
        if: always()
        run: |
          sed -i 's+home/runner/work/rudderstack-shopify-tracker/rudderstack-shopify-tracker+/github/workspace+g' reports/coverage/lcov.info
          sed -i 's+/home/runner/work/rudderstack-shopify-tracker/rudderstack-shopify-tracker+/github/workspace+g' reports/eslint.json

      # sonarcloud-github-action is archived. sonarqube-scan-action is its
      # successor and targets SonarQube Cloud when no SONAR_HOST_URL is set.
      - name: SonarQube Cloud Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
