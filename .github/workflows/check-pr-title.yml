name: Check PR Title

# Squash merge makes the PR title the commit subject on the base branch,
# and the release changelog reads these subjects. Branch commit messages
# are not checked.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - converted_to_draft
      - ready_for_review
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # action-semantic-pull-request reads the PR
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            chore
            refactor
            docs
            test
          requireScope: false
          # No ASCII uppercase letter or space first, no "." or space last.
          subjectPattern: ^(?![A-Z\s]).+(?<![.\s])$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}"
            must not start with an uppercase character or a space, and must
            not end with a period or a space.
