name: Build Shopify Tracker Docker Image

on:
  workflow_call:
    inputs:
      img_tag:
        required: true
        type: string
      target:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

jobs:
  build-images:
    name: Build Docker Images
    timeout-minutes: 45
    permissions:
      id-token: write # configure-aws-credentials requests an OIDC token for the ECR push role
      contents: read # actions/checkout
    strategy:
      matrix:
        build-config:
          - os: arc-arm64
            tags: ${{ format('rudderstack/rudder-shopify-tracker:{0}-arm64', inputs.img_tag) }}
            platform: linux/arm64
          - os: arc-amd64
            tags: ${{ format('rudderstack/rudder-shopify-tracker:{0}-amd64', inputs.img_tag) }}
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-build-push

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and Push Multi-platform Images to ECR
        uses: rudderlabs/build-scan-push-action@8b0c8fa6e6d526c296bc1de587abb8ed2ee6e903 # v2.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ format('{0}/{1}', steps.login-ecr.outputs.registry, matrix.build-config.tags) }}
          platforms: ${{ matrix.build-config.platform }}

      # Runs the pushed image before Docker Hub and the manifests see it: the
      # Node version must equal .nvmrc, and Node must reject the eMudhra chain.
      - name: Smoke test the image
        env:
          IMAGE: ${{ format('{0}/{1}', steps.login-ecr.outputs.registry, matrix.build-config.tags) }}
        run: scripts/image-smoke.sh "$IMAGE"

      - name: Login to DockerHub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Multi-platform Images to DockerHub
        uses: rudderlabs/build-scan-push-action@8b0c8fa6e6d526c296bc1de587abb8ed2ee6e903 # v2.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ matrix.build-config.tags }}
          platforms: ${{ matrix.build-config.platform }}

  create-manifest-ecr:
    name: Create multi-arch manifest for ECR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # configure-aws-credentials requests an OIDC token for the ECR push role
    needs: [build-images]
    env:
      IMG_TAG: ${{ inputs.img_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-manifest

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Create multi-arch manifest for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          tag="${REGISTRY}/rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"

      - name: Create latest multi-arch manifest for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          tag="${REGISTRY}/rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "${REGISTRY}/rudderstack/rudder-shopify-tracker:latest" "${tag}-amd64" "${tag}-arm64"

  create-manifest-dockerhub:
    name: Create multi-arch manifest for DockerHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [build-images]
    env:
      IMG_TAG: ${{ inputs.img_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to DockerHub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          tag="rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"

      - name: Create latest multi-arch manifest
        run: |
          tag="rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t rudderstack/rudder-shopify-tracker:latest "${tag}-amd64" "${tag}-arm64"
