name: Build Shopify Tracker Docker Image

on:
  workflow_call:
    inputs:
      img_tag:
        required: true
        type: string
      target:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

jobs:
  build-images:
    name: Build Docker Images
    timeout-minutes: 45
    permissions:
      id-token: write # configure-aws-credentials requests an OIDC token for the ECR push role
      contents: read # actions/checkout
    strategy:
      matrix:
        build-config:
          - os: arc-arm64
            tags: ${{ format('rudderstack/rudder-shopify-tracker:{0}-arm64', inputs.img_tag) }}
            platform: linux/arm64
          - os: arc-amd64
            tags: ${{ format('rudderstack/rudder-shopify-tracker:{0}-amd64', inputs.img_tag) }}
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-build-push

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and Push Multi-platform Images to ECR
        id: push-ecr
        uses: rudderlabs/build-scan-push-action@c47115e5eab78162efec1b4961cba4063dfd8d5f # v2.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ format('{0}/{1}', steps.login-ecr.outputs.registry, matrix.build-config.tags) }}
          platforms: ${{ matrix.build-config.platform }}

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Copies the built ECR image to Docker Hub, so both registries
      # serve the same digest. A second build could resolve newer packages.
      - name: Copy the built image to DockerHub
        env:
          SOURCE: ${{ steps.login-ecr.outputs.registry }}/rudderstack/rudder-shopify-tracker@${{ steps.push-ecr.outputs.digest }}
          TARGET: ${{ matrix.build-config.tags }}
        run: docker buildx imagetools create --prefer-index=false -t "docker.io/$TARGET" "$SOURCE"

  create-manifest-ecr:
    name: Create multi-arch manifest for ECR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # configure-aws-credentials requests an OIDC token for the ECR push role
    needs: [build-images]
    env:
      IMG_TAG: ${{ inputs.img_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-manifest

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Create multi-arch manifest for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          tag="${REGISTRY}/rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"

      - name: Create latest multi-arch manifest for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          tag="${REGISTRY}/rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "${REGISTRY}/rudderstack/rudder-shopify-tracker:latest" "${tag}-amd64" "${tag}-arm64"

  create-manifest-dockerhub:
    name: Create multi-arch manifest for DockerHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    needs: [build-images]
    env:
      IMG_TAG: ${{ inputs.img_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          tag="rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"

      - name: Create latest multi-arch manifest
        run: |
          tag="rudderstack/rudder-shopify-tracker:${IMG_TAG}"
          docker buildx imagetools create -t rudderstack/rudder-shopify-tracker:latest "${tag}-amd64" "${tag}-arm64"
