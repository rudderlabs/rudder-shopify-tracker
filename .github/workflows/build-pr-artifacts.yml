name: Build Artifacts for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR builds are build-only: GitHub-hosted runners, no registry login, no
  # push and no cloud credentials. PR code can edit this workflow, so a PR
  # job must hold nothing that publishes an image. Each arch builds natively.
  # apk fails the build when no ca-certificates-bundle>=20261020 is available.
  build-only:
    name: Build ${{ matrix.target }} image (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: [development, production]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build the image
        env:
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" -t "shopify-tracker:pr-$TARGET" .
