name: Build Artifacts for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR builds are build-only: GitHub-hosted runners, no registry login, no
  # push and no cloud credentials. PR code can edit this workflow, so a PR
  # job must hold nothing that publishes an image. Each arch builds natively.
  # The Dockerfile fails on a Node binary that differs from .nvmrc and on an
  # old CA bundle.
  build-only:
    name: Build ${{ matrix.target }} image (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: [development, production]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build the image
        env:
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" -t "shopify-tracker:pr-$TARGET" .
